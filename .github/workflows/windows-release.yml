name: AsmrDownloader Release Build

# KaneoPilot 通过 workflow_dispatch 触发本工作流，契约输入为
# target_sha / release_batch_id / task_manifest_json / task_manifest_sha256 / tag_name。
# Pilot 用运行的 display_title 认领运行，因此 dispatch 时 run-name 必须精确等于
# pilot-release-<release_batch_id>；它同时要求 run.head_sha 等于冻结的工作流 ref 头。
# 注意：这里不要加 concurrency 组 —— GitHub 会替换 pending run，Pilot 会丢失调度回执。
# tag 推送（v*）仍按原方式构建并发布。
#
# 发布产物名固定（不带版本号），与 KaneoPilot 发布策略的 required_assets 对应：
#   AsmrDownloader-Windows.zip / AsmrDownloader-macOS.zip
# 发布完成门还要求本次运行产出一个 artifact `kaneopilot-provenance`，压缩包内只有
# 一个 `kaneopilot-release.json`；它由 .github/scripts/pilot_release.py prepare 生成，
# 同一份字节再作为 Release 资产上传（Release 里必须有同名资产且字节完全一致）。
run-name: "${{ inputs.release_batch_id != '' && format('pilot-release-{0}', inputs.release_batch_id) || format('Release {0}', github.ref_name) }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_sha:
        description: '要构建的完整 commit SHA（Pilot 冻结的构建源；构建 job 用它 checkout，而不是默认 ref）'
        required: true
        type: string
      release_batch_id:
        description: 'Pilot 冻结的发布批次标识；本次运行的标题固定为 pilot-release-<release_batch_id>'
        required: true
        type: string
      task_manifest_json:
        description: 'Pilot 发布清单（规范 UTF-8 JSON）；发布说明取其中的 changelog reporter/summary'
        required: true
        type: string
      task_manifest_sha256:
        description: 'task_manifest_json 原始字节的 SHA-256，用于核对清单未被改写'
        required: true
        type: string
      tag_name:
        description: '要指向 target_sha 创建并发布 Release 的 tag（如 v0.16.2）'
        required: true
        type: string
      version:
        description: '（兼容旧手动触发）版本号；新契约下版本由 tag_name 决定，仅在 tag_name 缺失时回退'
        required: false
        type: string

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # dispatch 构建冻结的 target_sha；tag 推送退回本轮 commit
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  build-windows:
    runs-on: windows-latest
    needs: quality-gate

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ inputs.tag_name || inputs.version || github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Release Folder
        shell: pwsh
        # 产物名固定，KaneoPilot 的 required_assets 直接用这个名字
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "AsmrDownloader-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: AsmrDownloader-Windows.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: quality-gate

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ inputs.tag_name || inputs.version || github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Test
        run: flutter test test/system_proxy_config_test.dart

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress Release Folder
        # 产物名固定，KaneoPilot 的 required_assets 直接用这个名字
        run: |
          ditto -c -k --keepParent "build/macos/Build/Products/Release/AsmrDownloader.app" "AsmrDownloader-macOS.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: AsmrDownloader-macOS.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    # tag 推送自动发布；Pilot dispatch 必须带 tag_name 才发布
    if: github.event_name == 'push' || inputs.tag_name != ''

    env:
      TAG_NAME: "${{ inputs.tag_name || inputs.version || github.ref_name }}"
      TARGET_SHA: "${{ inputs.target_sha || github.sha }}"
      RELEASE_BATCH_ID: "${{ inputs.release_batch_id }}"
      TASK_MANIFEST_JSON: "${{ inputs.task_manifest_json }}"
      TASK_MANIFEST_SHA256: "${{ inputs.task_manifest_sha256 }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 工作流自身工具取冻结的工作流 commit，构建产物来自 target_sha
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-files/

      - name: Generate Release Notes From Task Manifest
        # 清单可能很大且含引号/换行，经 env 传入，避免拼进 shell
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          tag = os.environ.get("TAG_NAME", "").strip()
          target = os.environ.get("TARGET_SHA", "").strip()
          batch = os.environ.get("RELEASE_BATCH_ID", "").strip()
          raw = os.environ.get("TASK_MANIFEST_JSON", "")
          expected = os.environ.get("TASK_MANIFEST_SHA256", "").strip().lower()

          manifest = {}
          if raw.strip():
              actual = hashlib.sha256(raw.encode("utf-8")).hexdigest()
              if expected and actual != expected:
                  # prepare 会再严格校验一次；这里只提示，不打断发布说明生成
                  print(
                      "::warning::task_manifest_sha256 与清单内容不一致"
                      f"（期望 {expected}，实际 {actual}）"
                  )
              try:
                  manifest = json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"::warning::task_manifest_json 无法解析（{exc}），发布说明回退为默认内容")
                  manifest = {}

          if not isinstance(manifest, dict):
              manifest = {}

          entries = []

          # 前向兼容：清单顶层若直接带 changelog 对象
          changelog = manifest.get("changelog")
          if isinstance(changelog, dict):
              entries.append(changelog)

          # 当前 KaneoPilot 契约：changelog 的 reporter/summary 挂在对应成员上
          members = manifest.get("members")
          if isinstance(members, list):
              root = manifest.get("root_task_id")
              ordered = sorted(
                  (item for item in members if isinstance(item, dict)),
                  key=lambda item: 0 if root and item.get("task_id") == root else 1,
              )
              entries.extend(ordered)

          lines = ["## 本次变更", ""]
          seen = set()
          for entry in entries:
              summary = str(entry.get("summary") or "").strip()
              reporter = str(entry.get("reporter") or "").strip()
              if not summary:
                  continue
              if (summary, reporter) in seen:
                  continue
              seen.add((summary, reporter))
              lines.append(f"- {summary}" + (f"（{reporter}）" if reporter else ""))

          if len(lines) == 2:
              lines.append(f"- {tag or '本次构建'} 的发布产物由发布流水线生成")

          lines.extend(["", "## 构建信息", ""])
          if tag:
              lines.append(f"- 版本标签：`{tag}`")
          if target:
              lines.append(f"- 构建提交：`{target}`")
          if batch:
              lines.append(f"- 发布批次：`{batch}`")
          lines.extend(
              [
                  "",
                  "请下载对应平台的 zip，并用同批发布的 `kaneopilot-release.json` 校验完整性"
                  "（其中记录每个资产的 size 与 sha256）。",
              ]
          )

          notes = "\n".join(lines) + "\n"
          pathlib.Path("RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Prepare Provenance Manifest
        # 用本次运行落盘的两个 zip 生成 kaneopilot-release.json：assets 声明 size/sha256，
        # 同时核对 inputs 身份与 task_manifest 的规范字节（不通过就在发布前失败）
        run: python3 .github/scripts/pilot_release.py prepare release-files

      - name: Preserve Exact Release Provenance
        # artifact 名与内部文件名都被 KaneoPilot 的发布完成门精确匹配；单一文件路径会让
        # 压缩包里只有一个顶层条目 kaneopilot-release.json（无目录前缀）
        uses: actions/upload-artifact@v4
        with:
          name: kaneopilot-provenance
          path: release-files/kaneopilot-release.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Publish Release
        # 创建/复用 draft Release → 上传两个 zip 与同一份 kaneopilot-release.json → 回读
        # 校验 size/sha256 digest 后取消 draft；tag 必须指向 target_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/pilot_release.py publish release-files --notes-file RELEASE_NOTES.md
