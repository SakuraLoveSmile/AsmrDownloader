name: AsmrDownloader Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 v0.2.0），留空则不创建 Release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.event_name == 'push' && github.ref_name || inputs.version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Release Folder
        shell: pwsh
        run: |
          $ZipFileName = "${{ env.APP_NAME }}-${{ env.VERSION }}-Windows.zip"
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "$ZipFileName"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: "*.zip"
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.event_name == 'push' && github.ref_name || inputs.version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress Release Folder
        run: |
          ZipFileName="${{ env.APP_NAME }}-${{ env.VERSION }}-macOS.zip"
          ditto -c -k --keepParent "build/macos/Build/Products/Release/AsmrDownloader.app" "$ZipFileName"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: "*.zip"
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    # tag push 自动发布；手动触发时需填写 version 输入
    if: github.event_name == 'push' || github.event.inputs.version != ''

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.event_name == 'push' && github.ref_name || inputs.version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gh release create 在 tag 不存在时会自动创建（workflow_dispatch 场景）
        run: gh release create "$VERSION" dist/*.zip --title "$APP_NAME $VERSION"
