name: asmr_downloader
description: "asmr downloader"
publish_to: "none"
version: 0.16.0

environment:
  sdk: ^3.5.3

dependencies:
  archive: ^3.6.1
  collection: ^1.18.0
  crypto: ^3.0.3
  desktop_drop: ^0.7.1
  dio: ^5.7.0
  drift: ^2.18.0
  # 个人反馈组件（灵感球 + 视口截图），不发布到 pub.dev：固定 Git 标签 +
  # flutter/feedback 子目录。升级组件 = 改 ref + flutter pub get。
  feedback_widget:
    git:
      url: https://github.com/SakuraLoveSmile/Sakura-Feedback.git
      ref: v0.9.0
      path: flutter/feedback
  ffi: ^2.1.3
  file_picker: ^8.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  intl: any
  logger: ^2.4.0
  package_info_plus: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3_flutter_libs: ^0.5.0
  taglib_dart: ^1.0.0
  transparent_image: ^2.0.1
  window_manager: ^0.4.2
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
